[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-linux"
version = "0.1.0"
description = "Drag + Shift local file converter radial wheel for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "pynput>=1.7.6",
]

[project.scripts]
tangerine-linux = "tangerine.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = "venv"

[tool.pyrefly]
python-interpreter-path = "venv/bin/python"

[tool.pyrefly.errors]
bad-override-param-name = false